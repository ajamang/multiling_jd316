[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ajamang-multiling_jd316"
version = "0.1.0"
description = "在同一个输入里两两比对，检测多语言模型工程师·缓存命中率的归因相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ajamang" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ajamang.github.io"
Repository = "https://github.com/ajamang/multiling_jd316"
Issues = "https://github.com/ajamang/multiling_jd316/issues"

[project.scripts]
multiling_jd316 = "multiling_jd316:main"

[tool.setuptools]
py-modules = ["multiling_jd316"]
